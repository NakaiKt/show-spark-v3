[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = "-q"
markers = [
    "integration: DB が起動している必要があるテスト",
]
[tool.ruff]
# import の分類（自分のコードか外部パッケージか）の基準。
# 設定が無いと実行した場所が基準になり、エディタ（リポジトリ直下）と CLI（apps/api）で
# app の扱いが食い違って、保存のたびに並び順が入れ替わる
src = ["src", "."]
